<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Bitcoin block structure</title>
  <desc id="description">A block contains a header with its hash and the previous block hash, plus a list of transactions.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="28" fill="#09090b"/>
  <g font-family="Arial, sans-serif">
    <text x="600" y="58" fill="#e4e4e7" font-size="26" font-weight="700" text-anchor="middle">INSIDE A BITCOIN BLOCK</text>
    <rect x="70" y="170" width="270" height="190" rx="18" fill="url(#panel)" stroke="#52525b" stroke-width="3"/>
    <text x="205" y="218" fill="#a1a1aa" font-size="18" font-weight="700" text-anchor="middle">PREVIOUS BLOCK</text>
    <rect x="105" y="245" width="200" height="72" rx="12" fill="#18181b" stroke="#22d3ee" stroke-width="2"/>
    <text x="205" y="274" fill="#67e8f9" font-size="15" font-weight="700" text-anchor="middle">BLOCK HASH</text>
    <text x="205" y="299" fill="#d4d4d8" font-family="monospace" font-size="18" text-anchor="middle">0000...A91C</text>
    <path d="M345 265h120" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="485" y="125" width="645" height="340" rx="22" fill="url(#panel)" stroke="#f97602" stroke-width="3"/>
    <text x="807" y="169" fill="#fdba74" font-size="20" font-weight="700" text-anchor="middle">CURRENT BLOCK</text>
    <rect x="520" y="195" width="575" height="86" rx="14" fill="#18181b" stroke="#22d3ee" stroke-width="2"/>
    <text x="548" y="229" fill="#67e8f9" font-size="16" font-weight="700">BLOCK HEADER</text>
    <text x="548" y="263" fill="#d4d4d8" font-size="16">Previous block hash</text>
    <text x="1067" y="263" fill="#f4f4f5" font-family="monospace" font-size="16" text-anchor="end">0000...A91C</text>
    <rect x="520" y="294" width="575" height="52" rx="12" fill="#083344" stroke="#22d3ee" stroke-width="2"/>
    <text x="548" y="326" fill="#a5f3fc" font-size="15" font-weight="700">HASH OF THIS BLOCK (derived from its header)</text>
    <text x="1067" y="326" fill="#f4f4f5" font-family="monospace" font-size="16" text-anchor="end">0000...D72B</text>
    <rect x="520" y="360" width="575" height="84" rx="14" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
    <text x="548" y="393" fill="#fdba74" font-size="16" font-weight="700">TRANSACTIONS</text>
    <path d="M550 415h515" stroke="#52525b" stroke-width="2"/>
    <circle cx="566" cy="415" r="5" fill="#f97602"/>
  </g>
</svg>
