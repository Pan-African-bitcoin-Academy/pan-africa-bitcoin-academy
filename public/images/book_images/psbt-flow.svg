<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title description">
  <title id="title">Partially Signed Bitcoin Transaction flow</title>
  <desc id="description">A wallet prepares an unsigned transaction, a hardware signer verifies and signs it offline, and the signed transaction returns to the wallet for broadcast.</desc>
  <defs>
    <linearGradient id="wallet" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#164e63"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="signer" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7c2d12"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <marker id="cyanArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12z" fill="#22d3ee"/>
    </marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12z" fill="#fb923c"/>
    </marker>
  </defs>
  <rect width="1400" height="620" rx="30" fill="#09090b"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="700" y="58" fill="#e4e4e7" font-size="27" font-weight="700">SIGN A TRANSACTION WITHOUT EXPOSING YOUR KEYS</text>
    <rect x="70" y="160" width="340" height="300" rx="24" fill="url(#wallet)" stroke="#22d3ee" stroke-width="3"/>
    <text x="240" y="215" fill="#a5f3fc" font-size="22" font-weight="700">WALLET APP</text>
    <rect x="125" y="255" width="230" height="120" rx="14" fill="#09090b" stroke="#155e75" stroke-width="2"/>
    <path d="M160 290h160M160 316h130M160 342h145" stroke="#67e8f9" stroke-width="8" stroke-linecap="round"/>
    <text x="240" y="418" fill="#d4d4d8" font-size="17">Prepares the PSBT and broadcasts</text>
    <rect x="530" y="160" width="340" height="300" rx="24" fill="url(#signer)" stroke="#fb923c" stroke-width="3"/>
    <text x="700" y="215" fill="#fed7aa" font-size="22" font-weight="700">HARDWARE SIGNER · OFFLINE</text>
    <rect x="645" y="250" width="110" height="150" rx="20" fill="#09090b" stroke="#fdba74" stroke-width="3"/>
    <rect x="660" y="272" width="80" height="76" rx="8" fill="#172554"/>
    <path d="M672 295h56M672 315h42M690 370h20" stroke="#67e8f9" stroke-width="5" stroke-linecap="round"/>
    <text x="700" y="430" fill="#d4d4d8" font-size="17">Checks details, then signs</text>
    <rect x="1020" y="160" width="310" height="300" rx="24" fill="#18181b" stroke="#71717a" stroke-width="3"/>
    <text x="1175" y="215" fill="#e4e4e7" font-size="22" font-weight="700">BITCOIN NETWORK</text>
    <circle cx="1175" cy="318" r="55" fill="#09090b" stroke="#f97602" stroke-width="3"/>
    <path d="M1175 278v80M1156 292h31c20 0 20 24 0 24h-27m0 0h31c20 0 20 26 0 26h-35" fill="none" stroke="#fdba74" stroke-width="6" stroke-linecap="round"/>
    <text x="1175" y="418" fill="#d4d4d8" font-size="17">Receives the broadcast payment</text>
    <path d="M420 266h96" stroke="#22d3ee" stroke-width="5" marker-end="url(#cyanArrow)"/>
    <text x="468" y="238" fill="#67e8f9" font-size="16" font-weight="700">UNSIGNED PSBT</text>
    <path d="M520 366h-96" stroke="#fb923c" stroke-width="5" marker-end="url(#orangeArrow)"/>
    <text x="470" y="403" fill="#fdba74" font-size="16" font-weight="700">SIGNED PSBT</text>
    <path d="M880 318h126" stroke="#22d3ee" stroke-width="5" marker-end="url(#cyanArrow)"/>
    <text x="943" y="290" fill="#67e8f9" font-size="16" font-weight="700">BROADCAST</text>
    <rect x="220" y="520" width="960" height="54" rx="14" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
    <text x="700" y="555" fill="#d4d4d8" font-size="17">Private keys stay on the hardware signer; verify the address and amount on its screen.</text>
  </g>
</svg>
